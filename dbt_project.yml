name: 'food_truck_analytics'
version: '1.0.0'
config-version: 2

profile: 'food_truck_snowflake'

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  food_truck_analytics:
    staging:
      +materialized: view
      +tags: ["staging","silver"]
      +schema: "silver"
      
    intermediate:
      +materialized: table
      +tags: ["intermediate","silver"]
      +schema: "silver"
      
    marts:
      core:
        +materialized: table
        +tags: ["core","gold"]
        +schema: "gold"
        
      analytics:
        +materialized: table
        +tags: ["analytics","gold"]
        +schema: "gold"
        
    utils:
      +materialized: table
      +tags: ["utils"]

vars:
  # To generate dim_date
  date_spine_start: '2020-01-01'
  date_spine_end: '2030-12-31'